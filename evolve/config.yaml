# OpenEvolve configuration for EvoPlace Experiment 1: WL Smoothing Schedule Evolution
#
# This config drives evolutionary search over the gamma_schedule function.
# For Exp 2 (lambda_schedule), change initial_program and function_name below.

max_iterations: 200
log_level: INFO

# LLM ensemble
llm:
  models:
    - name: claude-sonnet-4-6
      weight: 0.7
    - name: claude-haiku-4-5-20251001
      weight: 0.3
  temperature: 0.8
  max_tokens: 2048
  # Diff-based mutation: LLM generates targeted changes rather than full rewrites
  diff_mode: true

# Population (MAP-Elites)
database:
  num_islands: 4
  population_per_island: 25
  feature_dimensions:
    - normalized_hpwl      # quality axis 1 (primary)
    - convergence_speed    # quality axis 2 (secondary, derived from runtime)
  migration_interval: 20   # migrate best programs between islands every N generations
  elite_size: 5            # keep top-5 programs in archive regardless of MAP-Elites grid

# Cascade evaluation (early stopping for bad programs)
evaluator:
  cascade_thresholds:
    - 2.0   # Stage 1 (50 iter): reject if norm_hpwl > 2.0×baseline
    - 1.3   # Stage 2 (300 iter): reject if norm_hpwl > 1.3×baseline
  timeout_seconds: 120     # per stage
  parallel_evaluations: 2  # run 2 evaluations in parallel (adjust to GPU count)

# Evolution prompt
prompt:
  system_message: |
    You are an expert EDA (Electronic Design Automation) algorithm researcher
    specializing in VLSI placement. Your task is to evolve the gamma_schedule
    function to minimize HPWL (half-perimeter wirelength) in differentiable
    global placement.

    Context:
    - gamma (γ) controls the WA-WL approximation smoothness in DREAMPlace
    - High γ (8.0): smooth gradients, inaccurate HPWL approximation
    - Low γ (0.5): accurate HPWL, noisy gradients
    - overflow: fraction of bins that are over-density (1.0 = all bins full)
    - iteration goes from 0 to total_iterations-1

    Known techniques:
    - Linear decay (current baseline): simple but sub-optimal
    - Exponential decay: faster decrease early, slower near end
    - Overflow-adaptive: tie γ to current overflow level
    - Gradient-norm adaptive: decrease γ faster when gradient norm is small
    - Piecewise/step schedules: different rates in different phases
    - Cosine annealing: smooth S-curve decrease

    Key insight: γ should be high early (when cells are clustered) to pull
    them toward their targets, then low at the end (when cells are spread)
    to get accurate wirelength gradients for fine-tuning.

    The function signature MUST be preserved exactly. Only modify the body.
    Return value must be a float in [0.01, 20.0].
    Do NOT add new imports. Do NOT add file I/O or external calls.

  user_message_template: |
    Current program:
    ```python
    {current_program}
    ```

    Current performance: normalized_hpwl = {score_display}
    Best so far: normalized_hpwl = {best_score_display}

    Generate an improved gamma_schedule function that reduces the HPWL.
    Think about what the current schedule might be doing wrong and propose
    a targeted improvement. Return only the modified Python function.

# Logging
output:
  results_dir: experiments/exp01_wl_smoothing/evolution_runs/
  save_all_programs: true
  checkpoint_interval: 25
